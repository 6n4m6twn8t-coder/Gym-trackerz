  <g class="frame f3"><use href="#bodyBase"/><ellipse cx="204" cy="213" rx="48" ry="27" fill="url(#chestBright)" opacity=".58"/><path d="M176 208 C160 191 151 173 148 151" stroke="url(#skinLite)" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M232 203 C248 186 258 168 261 146" stroke="url(#skinLite)" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M148 151 C146 134 148 119 153 102" stroke="url(#skinLite)" stroke-width="19" stroke-linecap="round" fill="none"/><path d="M261 146 C263 129 261 114 256 97" stroke="url(#skinLite)" stroke-width="19" stroke-linecap="round" fill="none"/><use href="#dumbbell" transform="translate(154 94)"/><use href="#dumbbell" transform="translate(255 89)"/></g>
