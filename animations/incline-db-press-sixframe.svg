  <g class="frame f5"><use href="#bodyBase"/><ellipse cx="204" cy="213" rx="49" ry="28" fill="url(#chestBright)" opacity=".86" filter="url(#glow)"/><path d="M179 206 C176 177 179 149 187 121" stroke="url(#skinLite)" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M229 201 C232 172 229 144 221 116" stroke="url(#skinLite)" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M187 121 C193 107 198 94 202 78" stroke="url(#skinLite)" stroke-width="19" stroke-linecap="round" fill="none"/><path d="M221 116 C215 102 210 89 206 73" stroke="url(#skinLite)" stroke-width="19" stroke-linecap="round" fill="none"/><use href="#dumbbell" transform="translate(202 70) rotate(3)"/><use href="#dumbbell" transform="translate(206 65) rotate(-3)"/></g>
  <g class="frame f6"><use href="#bodyBase"/><ellipse cx="204" cy="213" rx="50" ry="29" fill="url(#chestBright)" opacity="1" filter="url(#glow)"/><path d="M180 205 C183 174 189 143 199 111" stroke="url(#skinLite)" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M228 200 C225 169 219 138 209 106" stroke="url(#skinLite)" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M199 111 C203 96 205 81 205 64" stroke="url(#skinLite)" stroke-width="19" stroke-linecap="round" fill="none"/><path d="M209 106 C205 91 203 76 203 59" stroke="url(#skinLite)" stroke-width="19" stroke-linecap="round" fill="none"/><use href="#dumbbell" transform="translate(204 56) rotate(4)"/><use href="#dumbbell" transform="translate(204 51) rotate(-4)"/></g>
