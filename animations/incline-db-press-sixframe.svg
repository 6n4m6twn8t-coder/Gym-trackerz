  </defs>
  <style>.frame{opacity:0;animation-duration:3.6s;animation-timing-function:steps(1,end);animation-iteration-count:infinite}.f1{animation-name:f1}.f2{animation-name:f2}.f3{animation-name:f3}.f4{animation-name:f4}.f5{animation-name:f5}.f6{animation-name:f6}@keyframes f1{0%,9.9%,100%{opacity:1}10%,99.9%{opacity:0}}@keyframes f2{0%,9.9%{opacity:0}10%,19.9%{opacity:1}20%,89.9%{opacity:0}90%,99.9%{opacity:1}100%{opacity:0}}@keyframes f3{0%,19.9%{opacity:0}20%,29.9%{opacity:1}30%,79.9%{opacity:0}80%,89.9%{opacity:1}90%,100%{opacity:0}}@keyframes f4{0%,29.9%{opacity:0}30%,39.9%{opacity:1}40%,69.9%{opacity:0}70%,79.9%{opacity:1}80%,100%{opacity:0}}@keyframes f5{0%,39.9%{opacity:0}40%,49.9%{opacity:1}50%,59.9%{opacity:0}60%,69.9%{opacity:1}70%,100%{opacity:0}}@keyframes f6{0%,49.9%{opacity:0}50%,59.9%{opacity:1}60%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){.frame{animation:none}.f3{opacity:1}.f1,.f2,.f4,.f5,.f6{opacity:0}}</style>
  <rect width="420" height="420" rx="28" fill="#090b0e"/><circle cx="315" cy="93" r="130" fill="#b98327" opacity=".045"/><path d="M24 386 H396" stroke="#252a31" stroke-width="2"/><text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#f2d06b">6-FRAME • ~30° INCLINE</text>
