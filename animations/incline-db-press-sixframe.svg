<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Six-frame animated incline dumbbell press">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b67848"/><stop offset=".55" stop-color="#85502f"/><stop offset="1" stop-color="#4b2b1d"/></linearGradient>
    <linearGradient id="skinLite" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d39a67"/><stop offset="1" stop-color="#6a3e26"/></linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3038"/><stop offset="1" stop-color="#111419"/></linearGradient>
    <radialGradient id="chestDim"><stop offset="0" stop-color="#e66736"/><stop offset="1" stop-color="#7f2515"/></radialGradient>
    <radialGradient id="chestBright"><stop offset="0" stop-color="#ffd46b"/><stop offset=".45" stop-color="#ff7a2d"/><stop offset="1" stop-color="#a62f13"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
