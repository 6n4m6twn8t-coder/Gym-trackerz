<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Tracker" />
  <title>Gym Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/styles.css?v=7" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TRAINING LOG</p>
        <h1>Gym Tracker</h1>
      </div>
      <button class="icon-btn" id="installHintBtn" aria-label="Install help">＋</button>
    </header>

    <main id="app" class="app-main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="home" class="nav-btn active"><span>⌂</span><small>Today</small></button>
      <button data-route="library" class="nav-btn"><span>▦</span><small>Library</small></button>
      <button data-route="history" class="nav-btn"><span>↻</span><small>History</small></button>
    </nav>
  </div>

  <dialog id="exerciseDialog" class="exercise-dialog">
    <button class="dialog-close" data-close-dialog aria-label="Close">×</button>
    <div id="exerciseDialogBody"></div>
  </dialog>

  <dialog id="installDialog" class="exercise-dialog">
    <button class="dialog-close" data-close-install aria-label="Close">×</button>
    <div class="dialog-copy">
      <p class="eyebrow">IPHONE</p>
      <h2>Add it to your Home Screen</h2>
      <p>Open this site in Safari, tap Share, then choose <strong>Add to Home Screen</strong>. Your training data stays on this device.</p>
    </div>
  </dialog>

  <script type="module" src="./js/bootstrap-v7.js"></script>
  <script type="module" src="./js/touch-start-fix.js?v=1"></script>
</body>
</html>
